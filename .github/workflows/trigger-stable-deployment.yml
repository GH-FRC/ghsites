name: Trigger stable website deployment

on:
  push:
    branches:
      - stable
  workflow_dispatch:

concurrency:
  group: public-stable-deployment
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  trigger:
    name: Track private stable deployment
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out deployment tracker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create public deployment and run private workflow
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_GITHUB_TOKEN: ${{ secrets.PRIVATE_DEPLOYMENT_TRIGGER_TOKEN }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          PUBLIC_SHA: ${{ github.sha }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
          PUBLIC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRIVATE_REPOSITORY: GH-FRC/ghfrc-website-content
          PRIVATE_WORKFLOW: deploy-stable.yml
          PRIVATE_REF: stable
          PRIVATE_RUN_NAME_PREFIX: Deploy stable website for
          ENVIRONMENT_NAME: production
          ENVIRONMENT_URL: https://ghfrc.pages.dev
          DEPLOYMENT_LABEL: stable
        run: .github/scripts/track-private-deployment.sh
