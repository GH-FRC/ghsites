name: Trigger stable website deployment

on:
  push:
    branches:
      - stable

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger private stable deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Start private deployment workflow
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DEPLOYMENT_TRIGGER_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/GH-FRC/ghfrc-website-content/actions/workflows/deploy-stable.yml/dispatches \
            --data '{"ref":"stable"}'
