name: Preview pull request checks

on:
  pull_request:
    branches:
      - preview

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Preview pull request checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate website
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build website
        run: npm run build

      - name: Reject internal reference media
        run: |
          if find framework/dist -type f \( -iname '*.mov' -o -iname '*.lfs' \) -print -quit | grep -q .; then
            echo 'Internal reference media must not enter the build output.' >&2
            exit 1
          fi
          if grep -R -l -E 'particle-skin-ui-reference|git-lfs.github.com/spec' framework/dist >/dev/null; then
            echo 'An internal reference was found in the build output.' >&2
            exit 1
          fi
