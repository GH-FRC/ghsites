name: Record private deployment result

on:
  repository_dispatch:
    types:
      - stable_deployment_result
      - preview_deployment_result

permissions:
  contents: read
  deployments: write

jobs:
  record:
    name: Record private deployment result
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out deployment recorder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Record public Deployment
        env:
          PUBLIC_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          PUBLIC_SHA: ${{ github.event.client_payload.public_sha }}
          PUBLIC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ENVIRONMENT_NAME: ${{ github.event.action == 'stable_deployment_result' && 'production' || 'preview' }}
          ENVIRONMENT_URL: ${{ github.event.action == 'stable_deployment_result' && 'https://ghfrc.pages.dev' || 'https://preview.ghfrc.pages.dev' }}
          DEPLOYMENT_STATE: ${{ github.event.client_payload.state }}
          DEPLOYMENT_LABEL: ${{ github.event.action == 'stable_deployment_result' && 'stable' || 'Preview' }}
        run: .github/scripts/record-private-deployment-result.sh
